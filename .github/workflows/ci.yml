name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Fyne needs a C toolchain plus OpenGL/X11 headers on Linux.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Fyne needs OpenGL/X11 (and Wayland) headers; oto needs ALSA to
          # build its Linux audio driver.
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config \
            libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev \
            libasound2-dev

      - name: Verify formatting
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The real-audio tests open a device, which the race detector reports as
      # a race inside the oto driver rather than in Becoute, so they skip under
      # -race. Run them once without it to cover actual playback. The test
      # skips itself when the runner has no audio device.
      - name: Test (real audio playback)
        run: go test ./internal/audio/ ./internal/ui/ -run 'TestRealPlayback|TestRealPlayerDrivesUI' -v
        env:
          BECOUTE_AUDIO_IT: "1"

      - name: Build
        run: go build ./...
